version = "0.1.0"
algorithm = "sha384"
[data]
"policy.rego" = '''
package agent_policy

import future.keywords.if
import future.keywords.in
import future.keywords.every

# =============================================================================
# Container admission policy for the confidential inference node.
#
# This file is measured. Its digest is bound into the hardware attestation
# report, so a remote party can establish that these rules, and no others,
# govern the enclave. The agent that enforces them runs inside the encrypted
# virtual machine; the host asks that agent to perform each operation and
# cannot bypass it, because it cannot read or modify the agent's memory.
#
# WHAT THIS POLICY ENFORCES
#
#   * Both containers in the pod are admitted only on an exact match of their
#     command line, user, working directory, environment, mounts, capabilities,
#     devices, hooks, seccomp, sysctl and masked paths.
#   * Each container's root filesystem must be the image reference pinned for
#     it, and must be the filesystem the container is actually rooted on.
#   * No shell and no additional process may be started in either container.
#   * These rules cannot be replaced while the enclave runs.
#
# All tables below were taken from live requests on the target runtime, not
# from the workload specification, which differs from what the agent receives.
# Regenerate them after any change to the image, the workload specification or
# the guest components; each change produces a new attestation value, which is
# the intended behaviour.
# =============================================================================


# ========================= DEPLOYMENT VALUES =================================

# The workload image, pinned by digest. A tag names a mutable pointer; a digest
# names content, and the enclave verifies it while pulling.
allowed_images := [
    "docker.io/prabhanjang/cvn-sglang-glm53flash-v523@sha256:d0cb3c45f49a70b31a68cde0bafc5e6a8309ea5d9f2946d4c36ce87fd247847b",
]

# The orchestrator's infrastructure image, as this runtime names it.
#
# This is a TAG, not a digest: the runtime does not offer a digest for the
# sandbox image, so its content is not bound by this policy. Pinning the full
# reference below still prevents the sandbox container being created from an
# arbitrary image, which is the attack that matters, because a container in the
# pod shares the pod's network namespace and would reach the workload's
# loopback interface.
pause_image := "registry.k8s.io/pause:3.10.1"

workload_argv := ["/opt/cvn/entrypoint.sh"]
workload_uid := 0

# The complete environment of the workload process. Every entry originates in
# the measured image. Admission requires an exact match: a variable added,
# altered or removed is refused.
# Taken from the workload specification. The agent sees the image ENV and the
# pod env merged, so ### DERIVE ### the final set from a live request: the
# image contributes PATH and may contribute more.
#
# GENERATED - DO NOT HAND-EDIT. The block between the BEGIN/END markers is
# produced by gen-workload-env.sh from (a) the image config's ENV and (b) the
# pod spec's env, CONCATENATED and filtered - because the kata agent
# concatenates those two lists rather than merging them by key.
#
# Regenerate whenever the image or the pod spec changes, then re-register the
# MRCONFIGID. Any drift refuses the pod.
#
# ### BEGIN GENERATED workload_env ###
workload_env := {
    "CUDA_HOME=/usr/local/cuda",
    "CUDA_VERSION=13.0.3",
    "CVN_ACME_MODE=live",
    "CVN_ATTEST_BIND=127.0.0.1",
    "CVN_ATTEST_PORT=9000",
    "CVN_CONTEXT_LEN=1048576",
    "CVN_EP_SIZE=8",
    "CVN_GPU_ARCH=HOPPER",
    "CVN_GPU_COLLECT_CMD=nvattest collect-evidence --device gpu --format json --nonce {nonce}",
    "CVN_GPU_COLLECT_TIMEOUT=180",
    "CVN_GPU_VERIFIER_CMD=python3 -m ppcie.verifier.verification --nonce {nonce} --verifier remote --log-level info",
    "CVN_GW_REPORT_DATA_ENCODING=hex",
    "CVN_HAPROXY_CFG=/etc/haproxy/haproxy.cfg",
    "CVN_HASH_JOBS=4",
    "CVN_IMAGE_DIGEST=sha256:d0cb3c45f49a70b31a68cde0bafc5e6a8309ea5d9f2946d4c36ce87fd247847b",
    "CVN_KV_CACHE_DTYPE=auto",
    "CVN_MEM_FRACTION=0.75",
    "CVN_MODEL_ID=GLM-5.3-Flash",
    "CVN_REQUIRE_SWITCH_EVIDENCE=1",
    "CVN_SERVE_HOST=127.0.0.1",
    "CVN_SERVE_PORT=8000",
    "CVN_SPKI_ORIGIN=image",
    "CVN_SWITCH_COLLECT_CMD=nvattest collect-evidence --device nvswitch --format json --nonce {nonce}",
    "CVN_TLS_CERT=/dev/shm/cvn-tls/node.pem",
    "CVN_TLS_DIR=/dev/shm/cvn-tls",
    "CVN_TLS_NAME=ctf.armet.ai,api.ctf.armet.ai",
    "CVN_TP_SIZE=8",
    "CVN_WEIGHTS_DIR=/weights/GLM-5.3-Flash",
    "CVN_WEIGHTS_SHA384=b52f7ca1fbb5a117e621e919b7cc21aefed0dac37fe130ed7286d23c292fd24276400f2f0836aa8767a69ebf927c35a5",
    "DEBIAN_FRONTEND=noninteractive",
    "FLASHINFER_CONFIDENTIAL_COMPUTE=1",
    "FLASHINFER_VERSION=0.7.2",
    "GDRCOPY_HOME=/usr/src/gdrdrv-2.5.1/",
    "LANG=en_US.UTF-8",
    "LANGUAGE=en_US:en",
    "LC_ALL=en_US.UTF-8",
    "LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64",
    "LIBRARY_PATH=/usr/local/cuda/lib64/stubs",
    "MODEL_WEIGHTS_SHA384=b52f7ca1fbb5a117e621e919b7cc21aefed0dac37fe130ed7286d23c292fd24276400f2f0836aa8767a69ebf927c35a5",
    "NCCL_DEBUG=WARN",
    "NCCL_VERSION=2.28.3-1",
    "NVARCH=x86_64",
    "NVIDIA_DRIVER_CAPABILITIES=compute,utility",
    "NVIDIA_PRODUCT_NAME=CUDA",
    "NVIDIA_REQUIRE_CUDA=cuda>=13.0 brand=unknown,driver>=535,driver<536 brand=grid,driver>=535,driver<536 brand=tesla,driver>=535,driver<536 brand=nvidia,driver>=535,driver<536 brand=quadro,driver>=535,driver<536 brand=quadrortx,driver>=535,driver<536 brand=nvidiartx,driver>=535,driver<536 brand=vapps,driver>=535,driver<536 brand=vpc,driver>=535,driver<536 brand=vcs,driver>=535,driver<536 brand=vws,driver>=535,driver<536 brand=cloudgaming,driver>=535,driver<536 brand=unknown,driver>=550,driver<551 brand=grid,driver>=550,driver<551 brand=tesla,driver>=550,driver<551 brand=nvidia,driver>=550,driver<551 brand=quadro,driver>=550,driver<551 brand=quadrortx,driver>=550,driver<551 brand=nvidiartx,driver>=550,driver<551 brand=vapps,driver>=550,driver<551 brand=vpc,driver>=550,driver<551 brand=vcs,driver>=550,driver<551 brand=vws,driver>=550,driver<551 brand=cloudgaming,driver>=550,driver<551 brand=unknown,driver>=565,driver<566 brand=grid,driver>=565,driver<566 brand=tesla,driver>=565,driver<566 brand=nvidia,driver>=565,driver<566 brand=quadro,driver>=565,driver<566 brand=quadrortx,driver>=565,driver<566 brand=nvidiartx,driver>=565,driver<566 brand=vapps,driver>=565,driver<566 brand=vpc,driver>=565,driver<566 brand=vcs,driver>=565,driver<566 brand=vws,driver>=565,driver<566 brand=cloudgaming,driver>=565,driver<566 brand=unknown,driver>=570,driver<571 brand=grid,driver>=570,driver<571 brand=tesla,driver>=570,driver<571 brand=nvidia,driver>=570,driver<571 brand=quadro,driver>=570,driver<571 brand=quadrortx,driver>=570,driver<571 brand=nvidiartx,driver>=570,driver<571 brand=vapps,driver>=570,driver<571 brand=vpc,driver>=570,driver<571 brand=vcs,driver>=570,driver<571 brand=vws,driver>=570,driver<571 brand=cloudgaming,driver>=570,driver<571 brand=unknown,driver>=575,driver<576 brand=grid,driver>=575,driver<576 brand=tesla,driver>=575,driver<576 brand=nvidia,driver>=575,driver<576 brand=quadro,driver>=575,driver<576 brand=quadrortx,driver>=575,driver<576 brand=nvidiartx,driver>=575,driver<576 brand=vapps,driver>=575,driver<576 brand=vpc,driver>=575,driver<576 brand=vcs,driver>=575,driver<576 brand=vws,driver>=575,driver<576 brand=cloudgaming,driver>=575,driver<576",
    "NVIDIA_VISIBLE_DEVICES=all",
    "NV_CUDA_CUDART_DEV_VERSION=13.0.96-1",
    "NV_CUDA_CUDART_VERSION=13.0.96-1",
    "NV_CUDA_LIB_VERSION=13.0.3-1",
    "NV_CUDA_NSIGHT_COMPUTE_DEV_PACKAGE=cuda-nsight-compute-13-0=13.0.3-1",
    "NV_CUDA_NSIGHT_COMPUTE_VERSION=13.0.3-1",
    "NV_CUDNN_PACKAGE=libcudnn9-cuda-13=9.14.0.64-1",
    "NV_CUDNN_PACKAGE_DEV=libcudnn9-dev-cuda-13=9.14.0.64-1",
    "NV_CUDNN_PACKAGE_DEV_HEADERS=libcudnn9-headers-cuda-13=9.14.0.64-1",
    "NV_CUDNN_PACKAGE_NAME=libcudnn9-cuda-13",
    "NV_CUDNN_VERSION=9.14.0.64-1",
    "NV_LIBCUBLAS_DEV_PACKAGE=libcublas-dev-13-0=13.1.1.3-1",
    "NV_LIBCUBLAS_DEV_PACKAGE_NAME=libcublas-dev-13-0",
    "NV_LIBCUBLAS_DEV_VERSION=13.1.1.3-1",
    "NV_LIBCUBLAS_PACKAGE=libcublas-13-0=13.1.1.3-1",
    "NV_LIBCUBLAS_PACKAGE_NAME=libcublas-13-0",
    "NV_LIBCUBLAS_VERSION=13.1.1.3-1",
    "NV_LIBCUSPARSE_DEV_VERSION=12.6.3.3-1",
    "NV_LIBCUSPARSE_VERSION=12.6.3.3-1",
    "NV_LIBNCCL_DEV_PACKAGE=libnccl-dev=2.28.3-1+cuda13.0",
    "NV_LIBNCCL_DEV_PACKAGE_NAME=libnccl-dev",
    "NV_LIBNCCL_DEV_PACKAGE_VERSION=2.28.3-1",
    "NV_LIBNCCL_PACKAGE=libnccl2=2.28.3-1+cuda13.0",
    "NV_LIBNCCL_PACKAGE_NAME=libnccl2",
    "NV_LIBNCCL_PACKAGE_VERSION=2.28.3-1",
    "NV_LIBNPP_DEV_PACKAGE=libnpp-dev-13-0=13.0.1.2-1",
    "NV_LIBNPP_DEV_VERSION=13.0.1.2-1",
    "NV_LIBNPP_PACKAGE=libnpp-13-0=13.0.1.2-1",
    "NV_LIBNPP_VERSION=13.0.1.2-1",
    "NV_NVML_DEV_VERSION=13.0.87-1",
    "NV_NVTX_VERSION=13.0.85-1",
    "PATH=/root/.cargo/bin:/opt/sglang/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/nvidia/bin",
    "SGLANG_BUILD_COMMIT=297e54fd105e974cdf401e5b4d20253a22c16f90",
    "SGLANG_BUILD_URL=https://github.com/sgl-project/sglang/actions/runs/40978390987",
    "SGLANG_FORCE_CONFIDENTIAL_COMPUTE=1",
    "SGLANG_IMAGE_TAG=lmsysorg/sglang:v0.5.23",
    "SGLANG_RUST_BUILD_MODE=never",
    "UV_LINK_MODE=copy",
    "UV_PYTHON_INSTALL_DIR=/opt/python",
    "UV_PYTHON_PREFERENCE=only-managed",
    "VIRTUAL_ENV=/opt/sglang",
}
# ### END GENERATED workload_env ###

# Values the orchestrator supplies and legitimately varies between clusters and
# restarts. The key is fixed and the value constrained by shape, so these
# cannot carry content into the environment. They are the reason the policy
# does not claim that the host contributes nothing to the environment: it
# contributes these, and only in these shapes.
platform_env_patterns := [
    `^HOSTNAME=[a-zA-Z0-9][a-zA-Z0-9.-]{0,62}$`,
    `^KUBERNETES_SERVICE_HOST=[0-9.]+$`,
    `^KUBERNETES_SERVICE_PORT(_HTTPS)?=[0-9]+$`,
    `^KUBERNETES_PORT=tcp://[0-9.]+:[0-9]+$`,
    `^KUBERNETES_PORT_443_TCP(_PROTO=tcp|_PORT=443|_ADDR=[0-9.]+|=tcp://[0-9.]+:443)$`,
    `^TERM=[a-z0-9-]+$`,
]

# The capability set both containers receive. Ambient and inheritable must be
# empty; the three effective sets must match exactly, so neither a capability
# added nor one silently widened is admitted.
# The sandbox container gets the runtime's default set.
pause_caps := {
    "CAP_CHOWN", "CAP_DAC_OVERRIDE", "CAP_FSETID", "CAP_FOWNER", "CAP_MKNOD",
    "CAP_NET_RAW", "CAP_SETGID", "CAP_SETUID", "CAP_SETFCAP", "CAP_SETPCAP",
    "CAP_NET_BIND_SERVICE", "CAP_SYS_CHROOT", "CAP_KILL", "CAP_AUDIT_WRITE",
}

# The workload runs privileged, so the runtime hands it the full set. Pinned
# exactly, so it is still a fixed list rather than "whatever the host sends" -
# but note what is in it: CAP_SYS_ADMIN, CAP_SYS_PTRACE, CAP_SYS_MODULE,
# CAP_SYS_RAWIO. Inside the TD these are real. Dropping privileged: true and
# granting only what the GPU plumbing needs would shrink this list a long way,
# and is worth testing before the release is cut.
workload_caps := {
    "CAP_AUDIT_CONTROL", "CAP_AUDIT_READ", "CAP_AUDIT_WRITE", "CAP_BLOCK_SUSPEND",
    "CAP_BPF", "CAP_CHECKPOINT_RESTORE", "CAP_CHOWN", "CAP_DAC_OVERRIDE",
    "CAP_DAC_READ_SEARCH", "CAP_FOWNER", "CAP_FSETID", "CAP_IPC_LOCK",
    "CAP_IPC_OWNER", "CAP_KILL", "CAP_LEASE", "CAP_LINUX_IMMUTABLE",
    "CAP_MAC_ADMIN", "CAP_MAC_OVERRIDE", "CAP_MKNOD", "CAP_NET_ADMIN",
    "CAP_NET_BIND_SERVICE", "CAP_NET_BROADCAST", "CAP_NET_RAW", "CAP_PERFMON",
    "CAP_SETFCAP", "CAP_SETGID", "CAP_SETPCAP", "CAP_SETUID",
    "CAP_SYSLOG", "CAP_SYS_ADMIN", "CAP_SYS_BOOT", "CAP_SYS_CHROOT",
    "CAP_SYS_MODULE", "CAP_SYS_NICE", "CAP_SYS_PACCT", "CAP_SYS_PTRACE",
    "CAP_SYS_RAWIO", "CAP_SYS_RESOURCE", "CAP_SYS_TIME", "CAP_SYS_TTY_CONFIG",
    "CAP_WAKE_ALARM",
}

# Compared as sets: the runtime returns these in a different order for the two
# containers, so a list comparison would refuse one of them.
masked_paths := {
    # Measured 4 Nov on the sandbox: 11 entries, and /proc/interrupts is
    # NOT among them.
    "/proc/acpi", "/proc/asound", "/proc/kcore",
    "/proc/keys", "/proc/latency_stats", "/proc/timer_list",
    "/proc/timer_stats", "/proc/sched_debug", "/proc/scsi",
    "/sys/firmware", "/sys/devices/virtual/powercap",
}

readonly_paths := {
    "/proc/bus", "/proc/fs", "/proc/irq", "/proc/sys", "/proc/sysrq-trigger",
}

# Kernel parameters. The workload receives none; the sandbox receives two.
workload_sysctl := {}
pause_sysctl := {
    "net.ipv4.ip_unprivileged_port_start": "0",
    "net.ipv4.ping_group_range": "0 2147483647",
}

# The complete mount table for the workload. Each row fixes the destination,
# the filesystem type, the permitted source path and the exact option set. A
# mount absent from the table, or differing in one option, is refused.
#
# Source paths are patterns because the runtime generates them per sandbox; the
# pattern admits only the enclave's own shared directory, for that one file.
#
# The 16 hex chars are per FILE, not per boot: the same four values appeared in
# two separate boots (3ac2f4628ee9533e hosts, b8185aa0f8f15616
# termination-log, c00d24d722dd603c hostname, e55d997e8dac7257 resolv.conf).
# Left as a pattern anyway rather than pinned, because nothing documents them
# as stable.
#
# The prefix is built from THIS request's container_id, so a mount cannot point
# at another container's shared files. That is strictly tighter than matching
# any 64-hex string, and it is the binding expected_rootfs already uses.
cid := object.get(input, "container_id", "\u0000")

# cid is interpolated into a regex below, so its charset is constrained first.
# No character this permits is a regex metacharacter, so it cannot widen the
# pattern. It also still accepts a short name, should the runtime send one.
default cid_sane := false
cid_sane if regex.match(`^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$`, cid)

# `name` is a regex fragment, so a literal dot must arrive already escaped.
shared_re(name) := concat("", [`^/run/kata-containers/shared/containers/`,
                               cid, `-[a-f0-9]{16}-`, name, `$`])

workload_mounts := [
    {"destination": "/proc",       "type": "proc",   "source": `^proc$`,   "options": {"nosuid", "noexec", "nodev"}},
    {"destination": "/dev",        "type": "tmpfs",  "source": `^tmpfs$`,  "options": {"nosuid", "strictatime", "mode=755", "size=65536k"}},
    {"destination": "/dev/pts",    "type": "devpts", "source": `^devpts$`, "options": {"nosuid", "noexec", "newinstance", "ptmxmode=0666", "mode=0620", "gid=5"}},
    {"destination": "/dev/shm",    "type": "bind",   "source": `^/run/kata-containers/sandbox/shm$`, "options": {"rbind"}},
    {"destination": "/dev/mqueue", "type": "mqueue", "source": `^mqueue$`, "options": {"nosuid", "noexec", "nodev"}},
    {"destination": "/sys",        "type": "sysfs",  "source": `^sysfs$`,  "options": {"nosuid", "noexec", "nodev", "rw"}},
    {"destination": "/sys/fs/cgroup", "type": "cgroup", "source": `^cgroup$`, "options": {"nosuid", "noexec", "nodev", "relatime", "rw"}},

    # The 306 GB weights volume, read-only. "ro" is the control that matters:
    # the process serving from these weights cannot rewrite them.
    {"destination": "/weights", "type": "bind", "source": `^/run/kata-containers/sandbox/storage/[A-Za-z0-9+/=]{1,16}$`, "options": {"rbind", "rprivate", "ro"}},

    {"destination": "/etc/hosts", "type": "bind", "source": shared_re(`hosts`), "options": {"rbind", "rprivate", "rw"}},
    {"destination": "/etc/hostname", "type": "bind", "source": shared_re(`hostname`), "options": {"rbind", "rprivate", "rw"}},
    {"destination": "/etc/resolv.conf", "type": "bind", "source": shared_re(`resolv\.conf`), "options": {"rbind", "rprivate", "rw"}},
    {"destination": "/dev/termination-log", "type": "bind", "source": shared_re(`termination-log`), "options": {"rbind", "rprivate", "rw"}},
]

# The complete mount table for the sandbox container. It is NOT the workload's:
# it has no control-group mount, and its resolver file is mounted read-only
# with different options. Its shared-file source pattern was already correct:
# the pause container's name IS the 64-hex sandbox id, so <name>-<16 hex>
# happens to match what was guessed. Verified against a live request 4 Nov.
pause_mounts := [
    {"destination": "/proc",       "type": "proc",   "source": `^proc$`,   "options": {"nosuid", "noexec", "nodev"}},
    {"destination": "/dev",        "type": "tmpfs",  "source": `^tmpfs$`,  "options": {"nosuid", "strictatime", "mode=755", "size=65536k"}},
    {"destination": "/dev/pts",    "type": "devpts", "source": `^devpts$`, "options": {"nosuid", "noexec", "newinstance", "ptmxmode=0666", "mode=0620", "gid=5"}},
    {"destination": "/dev/mqueue", "type": "mqueue", "source": `^mqueue$`, "options": {"nosuid", "noexec", "nodev"}},
    {"destination": "/sys",        "type": "sysfs",  "source": `^sysfs$`,  "options": {"nosuid", "noexec", "nodev", "rw"}},  # measured 4 Nov: rw, not ro
    {"destination": "/dev/shm",    "type": "bind",   "source": `^/run/kata-containers/sandbox/shm$`, "options": {"rbind"}},
    {"destination": "/etc/resolv.conf", "type": "bind", "source": `^/run/kata-containers/shared/containers(?:/passthrough)?/(watchable/)?[a-f0-9]{64}-[a-z0-9]{16}-resolv\.conf$`, "options": {"rbind", "ro", "nosuid", "nodev", "noexec"}},
]

# No mount and no storage may be placed at or beneath these paths, whatever the
# tables above say. This is the independent guard against the cheapest attack
# on a confidential workload: substituting code while the image digest, the
# command line and every hardware measurement stay identical.
protected_prefixes := [
    "/opt/cvn", "/usr", "/lib", "/lib64", "/bin", "/sbin", "/root",
    "/etc/ld.so.preload", "/etc/ld.so.conf", "/etc/ld.so.conf.d",
    "/etc/passwd", "/etc/group", "/etc/shadow", "/etc/nsswitch.conf",
]

# Environment names that may never appear. The exact-environment rule already
# refuses anything outside workload_env; this is a second barrier against an
# error in that set. Each entry is a documented way to execute different code,
# or to redirect what the attested code does, without altering the image.
forbidden_env_prefixes := [
    # Selects the file that computes the weights digest. The test harness sets
    # it deliberately; a pod never may.
    "CVN_DIGEST_LIB=",
    "LD_PRELOAD=", "LD_LIBRARY_PATH=", "LD_AUDIT=", "LD_PROFILE=",
    "LD_DEBUG=", "LD_DEBUG_OUTPUT=", "LD_ORIGIN_PATH=", "GLIBC_TUNABLES=",
    "PYTHONPATH=", "PYTHONSTARTUP=", "PYTHONHOME=", "PYTHONINSPECT=",
    "PYTHONWARNINGS=", "PYTHONEXECUTABLE=", "PYTHONVERBOSE=",
    "BASH_ENV=", "ENV=", "SHELLOPTS=", "BASHOPTS=", "PS4=", "IFS=",
    "NODE_OPTIONS=", "NODE_PATH=", "PERL5LIB=", "PERL5OPT=", "PERLLIB=",
    "RUBYOPT=", "RUBYLIB=", "JAVA_TOOL_OPTIONS=", "_JAVA_OPTIONS=",
    "JDK_JAVA_OPTIONS=", "CLASSPATH=", "GCONV_PATH=", "LOCPATH=", "NLSPATH=",
]

# ======================= END DEPLOYMENT VALUES ===============================


# ---- container identity ------------------------------------------------------
# Each container is identified by its command line, its user AND the container
# type the runtime reports. Without the type check, an additional container
# presenting the sandbox's command line would be judged by the sandbox rule.
is_workload if {
    input.OCI.Process.Args == workload_argv
    input.OCI.Process.User.UID == workload_uid
    ctype == "container"
}

is_pause if {
    input.OCI.Process.Args == ["/pause"]
    input.OCI.Process.User.UID == 65535
    ctype == "sandbox"
}

ctype := object.get(object.get(input.OCI, "Annotations", {}),
                    "io.kubernetes.cri.container-type", "")


# ---- admission ---------------------------------------------------------------
# Nothing is admitted by default. Every line below is a REQUIREMENT: all of
# them must hold for a container to be created.
#
# To add a restriction, add a line inside one of these bodies. Do NOT write a
# further `CreateContainerRequest if { ... }` rule: rules sharing a name are
# combined with OR, so a new rule is a new way to be admitted rather than a new
# restriction.
default CreateContainerRequest := false

CreateContainerRequest if {
    is_workload
    cid_sane
    # Measured 4 Nov. NOT "/" -- the workload inherits the image's WORKDIR.
    # The sandbox branch below really is "/".
    input.OCI.Process.Cwd == "/sgl-workspace/sglang"
    object.get(input, "sandbox_pidns", true) == false
    env_exact
    no_forbidden_env
    mounts_exact(workload_mounts)
    no_protected_mounts
    process_hardened(workload_caps, false, set(), set())
    sysctl_exact(workload_sysctl)
    root_readonly(false)
    storages_safe
    rootfs_bound
    workload_rootfs_pinned
}

CreateContainerRequest if {
    is_pause
    input.OCI.Process.Cwd == "/"
    object.get(input, "sandbox_pidns", true) == false
    pause_env_exact
    no_forbidden_env
    mounts_exact(pause_mounts)
    no_protected_mounts
    process_hardened(pause_caps, true, masked_paths, readonly_paths)
    sysctl_exact(pause_sysctl)
    root_readonly(true)
    storages_safe
    rootfs_bound
    pause_rootfs_pinned
}


# ---- environment -------------------------------------------------------------
env_platform(e) if {
    some p in platform_env_patterns
    regex.match(p, e)
}

env_allowed(e) if e in workload_env
env_allowed(e) if env_platform(e)

env_exact if {
    env := object.get(input.OCI.Process, "Env", [])
    count(env) == count({e | some e in env})           # no repeated entry
    every e in env { env_allowed(e) }                   # nothing added or altered
    every w in workload_env { w in env }                # nothing removed
    env_keys_sane
}

# One value per variable. This was relaxed on 4 Nov and is now restored,
# because the pod spec no longer sets CVN_ACME_MODE: the image's "live" stands
# alone, so no key arrives twice.
#
# KEEP THIS TRAP IN MIND before adding any env var to the pod spec. The kata
# agent CONCATENATES image ENV and pod env rather than merging them by key, so
# setting a variable the image already sets produces TWO entries:
#   - different values  -> this rule refuses the pod
#   - identical values  -> env_exact's repeated-entry check refuses it, and
#                          gen-workload-env.sh aborts before you get that far
# The fix is to change the value in the image, or to accept a documented
# duplicate-key exception. Do not reach for the exception first.
#
# Which value would win if a duplicate were admitted: the entrypoint is a shell
# script and a shell builds its variable table by iterating environ with later
# entries overwriting earlier ones, so the LAST occurrence wins. That is NOT
# getenv(3), which returns the first - so a C consumer and a shell consumer
# would disagree. Another reason not to admit duplicates.
#
# Written with only the constructs the production policy already uses, because
# opa accepting a comprehension says nothing about regorus: the 4 Nov
# deny-everything loop was a comprehension opa accepts and regorus rejects,
# which fails the policy load with no diagnostic.
env_keys_sane if {
    keys := [split(e, "=")[0] | some e in object.get(input.OCI.Process, "Env", [])]
    every k in keys { count([x | some x in keys; x == k]) == 1 }
}

# The sandbox container receives only a search path.
pause_env_exact if {
    object.get(input.OCI.Process, "Env", []) ==
        ["PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"]
}

# The CUDA base image sets LD_LIBRARY_PATH and forbidden_env_prefixes bans it,
# so the pod is refused without an exception. This is byte-exact and the value
# is pinned in workload_env, so it is bound by the attestation report; the
# prefix ban stays in force for LD_PRELOAD, PYTHONPATH and everything else.
# DISCLOSE THIS TO THE REVIEWER -- it is a deliberate weakening of a control
# they have already read.
# DERIVED, not transcribed. The exception is "whatever LD_LIBRARY_PATH value is
# already pinned in workload_env" rather than a literal copied by hand, for two
# reasons: a single wrong byte in a hand-copied value refuses the pod, and the
# exception can then never admit a value that is not already measured, pinned
# and bound by the attestation report.
#
# Only the prefixes listed here can be excepted. Every other forbidden prefix
# stays banned outright, pinned or not - so this does not degrade into "any
# variable in workload_env is allowed".
forbidden_env_exception_prefixes := ["LD_LIBRARY_PATH="]

forbidden_env_exceptions := {e |
    some e in workload_env
    some p in forbidden_env_exception_prefixes
    startswith(e, p)
}

env_not_forbidden(e) if e in forbidden_env_exceptions
env_not_forbidden(e) if {
    every f in forbidden_env_prefixes { not startswith(e, f) }
}

no_forbidden_env if {
    every e in object.get(input.OCI.Process, "Env", []) { env_not_forbidden(e) }
}


# ---- process: capabilities, hooks, devices, seccomp, privilege ---------------
# Hooks execute arbitrary programs around the container's lifecycle, and a
# device entry exposes host hardware. Both must be absent. Capabilities are
# compared exactly rather than as a maximum.
# `privileged: true` and `allowPrivilegeEscalation: false` cannot be combined,
# so the workload necessarily runs with NoNewPrivileges false. That value is
# pinned rather than required to be true: pinning records what is actually the
# case, and a host that flips it is still refused. Dropping privileged is the
# only way to make this true, and it would also shrink workload_caps.
process_hardened(caps, nnp, want_masked, want_readonly) if {
    caps_exact(caps)
    object.get(input.OCI, "Hooks", "set") == null
    devices_exact
    object.get(linux, "Seccomp", "set") == null
    object.get(input.OCI.Process, "NoNewPrivileges", "unset") == nnp
    object.get(input.OCI.Process, "Terminal", true) == false
    count(object.get(input.OCI.Process, "Rlimits", ["x"])) == 0
    paths_exact(want_masked, want_readonly)
}

linux := object.get(input.OCI, "Linux", {})

# ### DERIVE ### Device plumbing.
#
# This node passes 8 GPUs and 4 NVSwitches into the guest, so neither list is
# empty and the rehearsal's "must be zero" check cannot hold. Each entry is
# matched exactly, so a device the host adds is refused while the ones the
# workload genuinely needs are admitted.
#
# Fill both tables from a live request. An empty table here means "no devices",
# which on this node refuses the pod - which is the safe way round: it fails
# loudly rather than admitting whatever the host offers.
oci_devices := []
agent_devices := []

# Measured 4 Nov: Linux.Devices == [] AND input.devices == [] on this node.
# The 8 GPUs and 4 NVSwitches arrive as CDI annotations and vfio-pci devices on
# the QEMU command line, not as OCI or agent devices -- so the earlier comment
# here ("neither list is empty") was wrong.
#
# Asserting emptiness directly rather than iterating an empty table. The
# iteration form also fails `opa check --strict` with an undefined-ref error,
# which is how this was noticed.
#
# Both default to a non-empty sentinel, so a field the runtime stops sending
# refuses the pod rather than passing silently.
devices_exact if {
    count(object.get(linux, "Devices", ["x"])) == 0
    count(object.get(input, "devices", ["x"])) == 0
}

device_matches(d, w) if {
    object.get(d, "path", "") == w.path
    object.get(d, "type", "") == w.type
    object.get(d, "major", -1) == w.major
    object.get(d, "minor", -1) == w.minor
}

agent_device_matches(d, w) if {
    object.get(d, "container_path", "") == w.container_path
    object.get(d, "type", "") == w.type
}

caps_exact(want) if {
    c := object.get(input.OCI.Process, "Capabilities", {})
    count(object.get(c, "Ambient", ["x"])) == 0
    count(object.get(c, "Inheritable", ["x"])) == 0
    {x | some x in object.get(c, "Bounding", [])} == want
    {x | some x in object.get(c, "Effective", [])} == want
    {x | some x in object.get(c, "Permitted", [])} == want
}

# Measured 4 Nov: the WORKLOAD has both lists EMPTY, because privileged: true
# removes them. The sandbox carries 11 and 5. A single shared pair, as this was
# written, refuses one container or the other whatever values it holds.
paths_exact(want_masked, want_readonly) if {
    {p | some p in object.get(linux, "MaskedPaths", [])} == want_masked
    {p | some p in object.get(linux, "ReadonlyPaths", [])} == want_readonly
}

sysctl_exact(want) if { object.get(linux, "Sysctl", {}) == want }

root_readonly(want) if {
    object.get(object.get(input.OCI, "Root", {}), "Readonly", "unset") == want
}


# ---- mounts ------------------------------------------------------------------
# The mount type is accepted under either serialisation the runtime may use.
mount_type(m) := t if { t := m.type_ } else := t if { t := m.type } else := ""

mount_matches(m, w) if {
    m.destination == w.destination
    mount_type(m) == w.type
    regex.match(w.source, m.source)
    {o | some o in object.get(m, "options", [])} == w.options
}

# GAP found 4 Nov by run-policy-tests.py: this checked only that every mount
# PRESENT is permitted, never that every expected mount is present - so a mount
# could be dropped silently. For a whitelist that is harmless (omitting a mount
# grants nothing), but this table is also the attested specification of the
# container's filesystem, and "the complete mount table" was not true of it.
# Coverage is now required in both directions.
#
# CONSEQUENCE: every row is now mandatory, so the table can no longer hold
# ALTERNATIVE rows for one mount - which is what the four enumerated cgroup
# option-sets used to be. If a future kernel needs alternatives, this rule has
# to change shape rather than the table growing rows.
mounts_exact(table) if {
    mounts := object.get(input.OCI, "Mounts", [])
    every m in mounts {
        some w in table
        mount_matches(m, w)
    }
    every w in table {
        some m in mounts
        mount_matches(m, w)
    }
    # Two mounts may not share a destination, so a permitted mount cannot be
    # covered by a second one layered over it.
    count({m.destination | some m in mounts}) == count(mounts)
}

under(path, prefix) if path == prefix
under(path, prefix) if startswith(path, concat("", [prefix, "/"]))

no_protected_mounts if {
    every m in object.get(input.OCI, "Mounts", []) {
        every p in protected_prefixes { not under(m.destination, p) }
    }
}


# ---- the root filesystem -----------------------------------------------------
# Two separate requirements.
#
# First, the container must be ROOTED ON the filesystem that was pulled. The
# request carries the container identifier, and the runtime derives both the
# storage mount point and the root path from it, so both are bound to it here.
# Pinning the pulled image without this would prove only that the right image
# was fetched somewhere, not that the container uses it.
#
# Second, that filesystem must be the pinned image. The reference in `source`
# is what the in-enclave image service resolves and whose manifest digest it
# verifies while pulling, so a digest reference binds content. The same
# reference also appears in the storage's driver options, under a different key
# for each container type; both are checked, so the two cannot be made to
# disagree.
rootfs_storages := [s |
    some s in object.get(input, "storages", [])
    object.get(s, "driver", "") == "image_guest_pull"
]

expected_rootfs := concat("", ["/run/kata-containers/",
                               object.get(input, "container_id", "\u0000"),
                               "/rootfs"])

rootfs_bound if {
    count(rootfs_storages) == 1
    some s in rootfs_storages
    object.get(s, "mount_point", "") == expected_rootfs
    object.get(object.get(input.OCI, "Root", {}), "Path", "") == expected_rootfs
}

# Structural requirements on a filesystem produced by the in-enclave pull.
# These deliberately fail closed if the runtime stops sending a field: a
# refusal with a clear message is preferable to a check that silently passes.
# GAP found 4 Nov by run-policy-tests.py: both pinning rules below used a bare
# contains() on the driver option, so the image-name JSON was accepted ANYWHERE
# in ANY driver option, under any prefix or none. The key must sit in the
# image-pull option specifically, so the option is anchored first.
driver_options_prefix := "image_guest_pull="

image_pull_option(s, key, val) if {
    some opt in object.get(s, "driver_options", [])
    startswith(opt, driver_options_prefix)
    contains(opt, concat("", [`"`, key, `":"`, val, `"`]))
}

storage_shape_ok(s) if {
    object.get(s, "fstype", "") == "overlay"
    object.get(s, "shared", true) == false
    object.get(s, "fs_group", "set") == null
    count(object.get(s, "options", ["x"])) == 0
}

workload_rootfs_pinned if {
    count(rootfs_storages) == 1
    some s in rootfs_storages
    some img in allowed_images
    object.get(s, "source", "") == img
    image_pull_option(s, "io.kubernetes.cri.image-name", img)
    storage_shape_ok(s)
}

pause_rootfs_pinned if {
    count(rootfs_storages) == 1
    some s in rootfs_storages
    object.get(s, "source", "") == "pause"
    image_pull_option(s, "io.kubernetes.cri.podsandbox.image-name", pause_image)
    storage_shape_ok(s)
}

# Every storage the host offers must match a row here. Each row fixes the
# driver, the filesystem type, the source and the mount point - not the mount
# point alone, which leaves the filesystem and its source free for the host to
# choose.
#
# Only the two storages this workload actually uses are listed. A wildcard tail
# on a mount-point pattern is what lets a path climb out of the directory it
# names, so there is none here, and `path_sane` refuses any parent-directory
# segment regardless.
# ### DERIVE ### Storage.
#
# Measured 4 Nov. The weights row is now present: driver scsi, ext4, source a
# scsi H:B address, mounted under sandbox/storage and bind-mounted onto
# /weights read-only by the mount table above.
#
# NOTE on the mount_point character class: it includes / and =, taken from the
# live value's alphabet. That means the pattern could in principle match an
# extra path segment under sandbox/storage. path_sane() and the
# protected_prefixes check still bound where it can land, and the mount table
# independently pins the bind destination to /weights with ro.
allowed_storages := [
    {"driver": "image_guest_pull",
     "fstype": "overlay",
     "mount_point": `^/run/kata-containers/[A-Za-z0-9][A-Za-z0-9_-]{0,63}/rootfs$`,
     "source": `^[A-Za-z0-9][A-Za-z0-9@:/._-]{0,250}$`,
     "options": set()},
    {"driver": "ephemeral",
     "fstype": "tmpfs",
     "mount_point": `^/run/kata-containers/sandbox/shm$`,
     "source": `^shm$`,
     "options": {"noexec", "nosuid", "nodev", "mode=1777", "size=67108864"}},
    {"driver": "scsi",
     "fstype": "ext4",
     "mount_point": `^/run/kata-containers/sandbox/storage/[A-Za-z0-9+/=]{1,16}$`,
     "source": `^[0-9]+:[0-9]+$`,
     "options": set()},
]

# A path the policy will reason about must be absolute, free of
# parent-directory segments, and free of empty segments. A pattern alone is not
# enough: a wildcard that looks bounded still matches `../../..`.
path_sane(p) if {
    startswith(p, "/")
    not contains(p, "..")
    not contains(p, "//")
    not contains(p, `\\`)
}

storage_allowed(s) if {
    some a in allowed_storages
    object.get(s, "driver", "") == a.driver
    object.get(s, "fstype", "") == a.fstype
    path_sane(object.get(s, "mount_point", ""))
    regex.match(a.mount_point, object.get(s, "mount_point", ""))
    regex.match(a.source, object.get(s, "source", ""))
    {o | some o in object.get(s, "options", [])} == a.options
}

storages_safe if {
    every s in object.get(input, "storages", []) {
        storage_allowed(s)
        every p in protected_prefixes { not under(object.get(s, "mount_point", ""), p) }
    }
}


# ---- sandbox creation --------------------------------------------------------
# This request can ask the agent to run hooks from a directory in the guest and
# to load kernel modules. Both are code execution inside the enclave, so both
# must be empty.
#
# The field names are the ones a live request carries, confirmed rather than
# assumed - a name this policy got wrong would read as absent and the check
# would then pass without doing anything.
#
# The shared PID namespace is pinned off. With it on, any container in the pod
# can see the inference process through /proc - its command line, its memory
# maps, and with the right capability its memory. That is a quiet way around
# everything else established here.
default CreateSandboxRequest := false

CreateSandboxRequest if {
    object.get(input, "guest_hook_path", "unset") == ""
    count(object.get(input, "kernel_modules", ["x"])) == 0
    object.get(input, "sandbox_pidns", true) == false
    sandbox_storages_safe
}

# The sandbox request carries its own storage list. Left unchecked it is a
# second, quieter way to place a filesystem of the host's choosing inside the
# enclave, so it is held to the same table and the same path rules.
sandbox_storages_safe if {
    every s in object.get(input, "storages", []) {
        storage_allowed(s)
        every p in protected_prefixes { not under(object.get(s, "mount_point", ""), p) }
    }
}


# ---- image pull --------------------------------------------------------------
# Where the runtime issues an image-pull request, only a pinned digest may be
# fetched. Not every runtime version consults this rule; the root-filesystem
# binding above is the one that applies on every admission.
default PullImageRequest := false

PullImageRequest if {
    some img in allowed_images
    input.image == img
}


# ---- files the host may deliver into the enclave ------------------------------
# Only the four files the orchestrator owns, at the per-sandbox paths the
# runtime generates for them. Any other path, and any path containing a
# parent-directory reference, is refused. Without this the host holds a general
# channel for placing a file of its choosing inside the enclave, which is the
# payload half of every library-preload attack.
copy_allowed := [
    `^/run/kata-containers/shared/containers(?:/passthrough)?/(watchable/)?[a-f0-9]{64}-[a-z0-9]{16}-(hosts|hostname|resolv\.conf|termination-log)$`,
]

default CopyFileRequest := false

CopyFileRequest if {
    path_sane(object.get(input, "path", ""))
    some p in copy_allowed
    regex.match(p, object.get(input, "path", ""))
    copy_mode_ok
    not_a_symlink
    # The request names the kind of file outright. A link, device node, socket
    # or directory delivered under a permitted name is refused here.
    object.get(input, "file_type", "") == "Regular"
}

# The request carries the link target explicitly, so this is the direct answer
# to "an allowed filename pointing outside the permitted directory": the NAME
# passes and the FILE does not.
#
# "No link" is accepted in either encoding the runtime may use - an empty string
# or a null. Neither weakens the check: a symbolic link always carries a
# non-empty target, so anything that is actually a link is refused by both.
not_a_symlink if { object.get(input, "symlink_target", "") == "" }
not_a_symlink if { object.get(input, "symlink_target", "") == null }

# Every regular-file mode that carries no execute, setuid, setgid or sticky
# bit: 0o100000 combined with read/write permissions for owner, group and
# other. Enumerated rather than computed, so the rule stays readable and does
# not depend on bitwise builtins the guest's policy engine may not provide.
#
# The four orchestrator files do not all share one mode - the termination log
# is commonly more permissive than the others - so pinning the single value
# seen on one file refuses the rest.
#
# What cannot match: a symbolic link (0o120777 = 41471), a directory
# (0o040755 = 16877), anything executable (0o100755 = 33261) and anything
# setuid (0o104644 = 35300).
allowed_copy_modes := [
    32768, 32770, 32772, 32774, 32784, 32786, 32788, 32790,
    32800, 32802, 32804, 32806, 32816, 32818, 32820, 32822,
    32896, 32898, 32900, 32902, 32912, 32914, 32916, 32918,
    32928, 32930, 32932, 32934, 32944, 32946, 32948, 32950,
    33024, 33026, 33028, 33030, 33040, 33042, 33044, 33046,
    33056, 33058, 33060, 33062, 33072, 33074, 33076, 33078,
    33152, 33154, 33156, 33158, 33168, 33170, 33172, 33174,
    33184, 33186, 33188, 33190, 33200, 33202, 33204, 33206,
]

copy_mode_ok if {
    some m in allowed_copy_modes
    object.get(input, "file_mode", -1) == m
}


# ---- container output --------------------------------------------------------
# Container output remains readable by the operator, deliberately.
#
# In this runtime the host draining the output stream is the only mechanism
# that empties it; refusing the read fills the buffer and stalls every process
# inside the enclave that writes to it. Closing this channel is therefore not a
# workable way to protect user content - the workload hangs instead.
#
# Confidentiality is established by controlling what reaches the stream. The
# exact-environment rule above makes debug and request logging unreachable,
# because the variables that would enable them cannot be set at all.
#
# The claim this supports, which a reader can check directly against the
# output: container logs carry operational metadata only, no prompts and no
# completions. The workload image additionally refuses to start if such logging
# is enabled, but that is a property of the image, not of this policy.
default ReadStreamRequest := true


# ---- refused -----------------------------------------------------------------
default ExecProcessRequest := false            # no shell, no additional process
default SetPolicyRequest := false              # these rules cannot be replaced after boot
default WriteStreamRequest := false            # no input injected into the workload
default ReseedRandomDevRequest := false        # the host cannot influence in-enclave key generation
default PauseContainerRequest := false         # the workload cannot be halted at a chosen moment
default ResumeContainerRequest := false
default AddSwapRequest := false                # enclave memory is never paged to host storage
default StartTracingRequest := false           # no tracing channel out of the enclave
default StopTracingRequest := false
default UpdateEphemeralMountsRequest := false  # the filesystem view cannot change after admission
default UpdateContainerRequest := false        # the container specification cannot change after admission
default SetGuestDateTimeRequest := false       # the host cannot move the clock, which would affect
                                               # certificate validity and attestation freshness
default GetDiagnosticDataRequest := false      # no diagnostic extraction from the enclave


# ---- permitted: sandbox lifecycle, network configuration and metrics --------
# What the runtime needs in order to start, observe and tear down the sandbox.
# None carries user content, and none can alter a container once admitted.
# Network configuration remains the host's in any case, since the host is the
# hypervisor.
default DestroySandboxRequest := true
default StartContainerRequest := true
default RemoveContainerRequest := true
default GuestDetailsRequest := true
default StatsContainerRequest := true
default GetOOMEventRequest := true
default WaitProcessRequest := true
default SignalProcessRequest := true
default CloseStdinRequest := true
default TtyWinResizeRequest := true
default OnlineCPUMemRequest := true
default MemHotplugByProbeRequest := true
default GetMetricsRequest := true
default RemoveStaleVirtiofsShareMountsRequest := true
default UpdateInterfaceRequest := true
default UpdateRoutesRequest := true
default ListInterfacesRequest := true
default ListRoutesRequest := true
default AddARPNeighborsRequest := true
'''
"aa.toml" = '''
[token_configs.ccm_as]
ccm_domain_names = ["fortanix.com"]
'''
"cdh.toml" = '''
[kbc]
name = "ccm_kbc"
url = "https://apps.amer.smartkey.io"
[kbc_configs.ccm_kbc]
dsm_app_id = "22b1bc64-a371-438d-af30-d714dfc212cb"
'''
